services:
  - type: web
    name: brotein-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:shared && npm run build -w backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
